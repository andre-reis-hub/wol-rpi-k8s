<div id="exporter-card">
  {% if ligado is none %}
    <p><small class="status-offline">Estado do exporter indisponível (i9 desligado?).</small></p>
  {% elif ligado %}
    <p><span class="status-online">● Coletando métricas</span></p>
    {% if is_admin %}
    <form hx-post="/exporter/stop" hx-target="#exporter-card" hx-swap="outerHTML">
      <button class="outline">⏸ Desligar coletor</button>
    </form>
    {% endif %}
  {% else %}
    <p><small>○ Coletor desligado</small></p>
    {% if is_admin %}
    <form hx-post="/exporter/start" hx-target="#exporter-card" hx-swap="outerHTML">
      <button>▶ Ligar coletor</button>
    </form>
    {% endif %}
  {% endif %}
</div>
