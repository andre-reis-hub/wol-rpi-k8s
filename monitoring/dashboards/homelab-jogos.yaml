apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-homelab-jogos
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  homelab-jogos.json: |
    {
      "title": "Homelab — Jogos & Servidores",
      "uid": "homelab-jogos",
      "tags": ["homelab", "jogos"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Total de jogadores agora",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            { "expr": "sum(game_players_online)", "instant": true, "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "blue", "value": 1 }
                ]
              },
              "unit": "short"
            }
          },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "value", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 2,
          "title": "Servidores ligados",
          "type": "stat",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            { "expr": "sum(game_server_up)", "instant": true, "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "text", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "max": 3,
              "unit": "short"
            }
          },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "value", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 3,
          "title": "Saúde da detecção",
          "type": "stat",
          "gridPos": { "h": 5, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            { "expr": "last_over_time(game_detection_ok[5m])", "legendFormat": "{{game}}", "instant": true, "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "mappings": [
                { "type": "value", "options": { "0": { "text": "FALHA" }, "1": { "text": "OK" } } }
              ]
            }
          },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "value_and_name", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 4,
          "title": "Jogadores online por jogo",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            { "expr": "max by (game) (game_players_online)", "legendFormat": "{{game}}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "stepAfter", "fillOpacity": 15 },
              "unit": "short",
              "min": 0
            }
          }
        },
        {
          "id": 5,
          "title": "Servidores ligados ao longo do tempo",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "$datasource" },
          "targets": [
            { "expr": "max by (game) (game_server_up)", "legendFormat": "{{game}}", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "drawStyle": "line", "lineInterpolation": "stepAfter", "fillOpacity": 20 },
              "unit": "short",
              "min": 0,
              "max": 1
            }
          }
        }
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          }
        ]
      }
    }
