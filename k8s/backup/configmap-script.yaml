apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-script
  namespace: backup
data:
  backup.sh: |
    #!/bin/bash
    set -euo pipefail
    echo "[backup] Iniciando $(date)"

    # Senha do restic (injetada pelo Vault Agent)
    export RESTIC_PASSWORD="$(cat /vault/secrets/restic-password)"

    # rclone.conf vem em base64 do Vault -> decodifica
    mkdir -p ~/.config/rclone
    base64 -d /vault/secrets/rclone-conf-b64 > ~/.config/rclone/rclone.conf

    REPO="rclone:gdrive:wol-backups"

    # Remove lock orfao ANTES de qualquer acesso ao repo
    restic -r "$REPO" unlock || true

    # Inicializa o repo SO se ele realmente nao existir; qualquer outro erro aparece no log
    if ! ERR=$(restic -r "$REPO" cat config 2>&1 >/dev/null); then
      if echo "$ERR" | grep -qiE 'does not exist|unable to open config file|Is there a repository'; then
        echo "[backup] Repositorio nao existe, inicializando..."
        restic -r "$REPO" init
      else
        echo "[backup] ERRO ao abrir o repositorio (nao vou tentar init):"
        echo "$ERR"
        exit 1
      fi
    fi

    # Remove lock orfao de um backup anterior que possa ter morrido no meio
    # (ex: i9 reiniciou durante o backup). Sem isso, a retencao abaixo falha
    # com "repository is already locked". O || true ignora se nao houver lock.
    echo "[backup] Limpando locks orfaos (se houver)..."
    restic -r "$REPO" unlock || true

    # Backup dos saves dos jogos
    echo "[backup] Rodando restic backup..."
    restic -r "$REPO" backup \
      /data/palworld \
      /data/abiotic-factor \
      /data/valheim \
      --tag "auto-$(date +%Y%m%d)" \
      --host wol-rpi-k8s

    # Retencao: manter 7 diarios
    echo "[backup] Aplicando retencao (7 diarios)..."
    restic -r "$REPO" forget --keep-daily 7 --prune

    echo "[backup] Concluido $(date)"
