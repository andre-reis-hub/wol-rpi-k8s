apiVersion: v1
kind: Service
metadata:
  name: enshrouded-service
  namespace: enshrouded
spec:
  type: NodePort
  selector:
    app: enshrouded-server
  ports:
    - name: game
      port: 15636
      targetPort: 15636
      protocol: UDP
      nodePort: 30636
    - name: query
      port: 15637
      targetPort: 15637
      protocol: UDP
      nodePort: 30637
