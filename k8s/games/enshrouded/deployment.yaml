apiVersion: apps/v1
kind: Deployment
metadata:
  name: enshrouded-server
  namespace: enshrouded
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: enshrouded-server
  template:
    metadata:
      labels:
        app: enshrouded-server
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "enshrouded"
        vault.hashicorp.com/agent-inject-secret-server-password: "wol/data/enshrouded"
        vault.hashicorp.com/agent-inject-template-server-password: |
          {{- with secret "wol/data/enshrouded" -}}
          {{ index .Data.data "server-password" }}
          {{- end -}}
        vault.hashicorp.com/agent-pre-populate-only: "true"
    spec:
      serviceAccountName: enshrouded-sa
      containers:
        - name: enshrouded-server
          image: mornedhels/enshrouded-server:latest
          env:
            - name: SERVER_NAME
              value: "Servidor do Andre - Enshrouded"
            - name: GAME_PORT
              value: "15636"
            - name: QUERY_PORT
              value: "15637"
            - name: SERVER_SLOTS
              value: "16"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          command: ["/bin/bash", "-c"]
          args:
            - |
              export SERVER_PASSWORD="$(cat /vault/secrets/server-password)"
              exec /entrypoint.sh
          ports:
            - containerPort: 15636
              protocol: UDP
            - containerPort: 15637
              protocol: UDP
          resources:
            requests:
              memory: "6Gi"
              cpu: "2000m"
            limits:
              memory: "12Gi"
              cpu: "6000m"
          volumeMounts:
            - name: enshrouded-data
              mountPath: /home/steam/enshrouded
      volumes:
        - name: enshrouded-data
          persistentVolumeClaim:
            claimName: enshrouded-pvc
