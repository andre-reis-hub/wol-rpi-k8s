apiVersion: apps/v1
kind: Deployment
metadata:
  name: enshrouded-server
  namespace: enshrouded
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: enshrouded-server
  template:
    metadata:
      labels:
        app: enshrouded-server
    spec:
      serviceAccountName: enshrouded-sa
      containers:
        - name: enshrouded-server
          image: mornedhels/enshrouded-server:latest
          env:
            - name: SERVER_NAME
              value: "Servidor do Andre - Enshrouded"
            - name: SERVER_SLOT_COUNT
              value: "16"
            - name: SERVER_QUERYPORT
              value: "15637"
            - name: GAME_PORT
              value: "15636"
            - name: UPDATE_CRON
              value: "*/30 * * * *"
            - name: UPDATE_CHECK_PLAYERS
              value: "true"
            - name: BACKUP_CRON
              value: "*/15 * * * *"
            - name: BACKUP_MAX_COUNT
              value: "12"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: STEAMCMD_ARGS
              value: "validate"
            - name: BOOTSTRAP_HOOK
              value: "rm -f /opt/enshrouded/steamapps/appmanifest_*.acf"
          ports:
            - containerPort: 15636
              protocol: UDP
            - containerPort: 15637
              protocol: UDP
          resources:
            requests:
              memory: "6Gi"
              cpu: "2000m"
            limits:
              memory: "12Gi"
              cpu: "6000m"
          volumeMounts:
            - name: enshrouded-data
              mountPath: /opt/enshrouded
      volumes:
        - name: enshrouded-data
          persistentVolumeClaim:
            claimName: enshrouded-pvc
